<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee sign in — TopCandidate.pro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#128A40;--orange:#F57C2E;--orange2:#E16A1F;--og:rgba(245,124,46,.1);
--bg:#F7F9FC;--surface:#fff;--border:#E4E8F0;--border2:#D5DCE8;--text:#1f2937;--t2:#4B5563;--t3:#6B7280;--rs:8px;--rl:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.card{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:0 4px 24px rgba(31,41,55,.08);padding:2rem 1.75rem}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:1.5rem}
h1{font-size:1.3rem;font-weight:800;letter-spacing:-.4px;margin-bottom:.35rem}
.sub{font-size:.9rem;color:var(--t2);margin-bottom:1.5rem}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:.35rem}
input{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--border2);border-radius:var(--rs);color:var(--text);outline:none;margin-bottom:1rem}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--og)}
.btn{width:100%;padding:13px;border:none;border-radius:var(--rs);background:var(--orange);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(245,124,46,.28)}
.btn:hover{background:var(--orange2)}
.btn:disabled{opacity:.6}
.err{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.25);color:#B91C1C;border-radius:var(--rs);padding:.7rem .85rem;font-size:.85rem;margin-bottom:1rem;display:none}
.err.on{display:block}
.foot{font-size:11.5px;color:var(--t3);margin-top:1.25rem;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg height="26" viewBox="0 0 64 64"><rect x="1" y="1" width="62" height="62" rx="14" fill="#EAF3DE"/><circle cx="28" cy="23" r="8.6" fill="#639922"/><path d="M12.5 49.8 C12.5 38.6 19.4 33 28 33 C36.6 33 43.5 38.6 43.5 49.8 Z" fill="#639922"/><circle cx="46.5" cy="46.5" r="13" fill="#EAF3DE"/><circle cx="46.5" cy="46.5" r="10.6" fill="#EF9F27"/><path d="M41.2 46.8 L45 50.5 L52.2 42.6" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    TopCandidate<span style="color:var(--orange)">.pro</span>
  </div>
  <h1>Employee sign in</h1>
  <p class="sub">Access your profile, leave, and attendance.</p>
  <div class="err" id="err"></div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@company.com">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Your password">
  <button class="btn" id="btn" onclick="signin()">Sign in</button>
  <div class="foot">Got an invite link? Open it to set your password first.<br>Not an employee? <a href="/login" style="color:var(--orange2);font-weight:700;text-decoration:none">Company sign in</a></div>
</div>
<script>
function showErr(m){ const e=document.getElementById('err'); e.textContent=m; e.classList.add('on'); }
async function signin(){
  document.getElementById('err').classList.remove('on');
  const email=document.getElementById('email').value.trim(), pw=document.getElementById('pw').value;
  if(!email||!pw){ showErr('Enter your email and password.'); return; }
  const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Signing in…';
  try{
    const r=await fetch('/api/auth/employee/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||'Sign in failed.');
    location.href='/employee';
  }catch(e){ showErr(e.message); btn.disabled=false; btn.textContent='Sign in'; }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')signin();});
</script>
</body>
</html>
